# Copy to config.yaml and edit.

project:
  name: sample-project
  # Path to the repository the agents will work on (relative to workspace_dir or absolute).
  repository: repository
  base_branch: main
  goal: >
    Describe the overall goal the harness should accomplish.

# Root directory holding harness.db / repository/ / worktrees/ / artifacts/ / logs/.
# The whole directory is portable: copy it to move or back up a project.
workspace_dir: workspace

provider:
  # Agent execution engine.
  #   openai-compatible = local vLLM endpoint (Qwen3.6-27B-FP8 on DGX Spark) — default
  #   claude            = Claude Agent SDK adapter
  type: openai-compatible
  model: qwen3.6-27b-fp8
  # Optional per-role overrides (provider type and/or model per role).
  roles: {}
  #  reviewer:
  #    type: claude
  #    model: claude-opus-5

# Local OpenAI-compatible inference endpoint (vLLM). See deploy/inference/.
# Which engine a role uses is decided by `provider.type` above, not here —
# unknown keys in this section are rejected rather than silently ignored.
inference:
  base_url: http://127.0.0.1:8000/v1
  model: qwen3.6-27b-fp8
  # performance (65536, production default) | long (131072) | maximum (262144).
  # Long profiles must also be enabled server-side (deploy/inference/.env).
  # The profile caps the input budget below: an unknown name is rejected.
  context_profile: performance
  # Input token budget; the remainder of the context window is reserved for
  # reasoning, tool calls and model output. Clamped to what context_profile
  # can hold after max_output_tokens.
  input_budget_tokens: 50000
  max_output_tokens: 8192
  sampling:                # Qwen3.6 coding-agent defaults; fixed per profile
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
  # role_sampling:         # optional per-role overrides
  #   reviewer:
  #     temperature: 0.2
  concurrency:
    # In-flight LLM request cap. Shares one gate with
    # parallelism.resource_pools.llm below; the SMALLER of the two wins and
    # a mismatch is logged. Keep it aligned with the server's --max-num-seqs.
    max_requests: 16
  # api_key: sk-...        # sent as a bearer token when the endpoint needs auth
  #                        # (leave as the default for a local vLLM without --api-key)
  streaming: false         # internal agents don't need token streaming;
                           # true switches the agent loop to SSE
  request_timeout_seconds: 600
  transient_retries: 4     # in-session retry of 429/5xx/transport failures

parallelism:
  max_parallel_tasks: 16
  # max_parallel_agent_runs: 16   # defaults to max_parallel_tasks
  resource_pools:
    llm: 16                # same gate as inference.concurrency.max_requests
    heavy_build: 2
    heavy_test: 2
    git_integration: 1     # integration is strictly serialized; keep at 1
  starvation_rounds: 8     # fairness aging for the ready queue

git:
  task_worktrees: true     # one isolated worktree + branch per task attempt
                           # (false is REFUSED: parallel tasks would share a tree)
  integration_strategy: serialized   # the only implemented strategy
  worktrees_dir: worktrees
  branch_prefix: harness/task

database:
  journal_mode: WAL
  busy_timeout_ms: 5000
  single_writer: true      # all writes serialized through one writer
                           # (false is REFUSED under parallel execution)

verification:
  # Preset command sets: java | python | node | none
  language: python
  # Explicit commands override the preset. Success == every exit code 0.
  commands: []
  #  - "pytest -q"
  timeout_seconds: 900

budget:
  project_usd: 100.0
  task_usd: 10.0
  agent_run_usd: 3.0

limits:
  max_attempts: 3          # failures per task before Diagnostician
  max_turns: 60            # per agent session
  max_agent_runs_per_task: 25
  max_execution_seconds: 172800   # whole-project wall clock (2 days)
  agent_run_timeout_seconds: 3600 # one agent session (cooperative cancellation)
  # Outputs larger than this are spilled to an artifact file; agent context
  # receives a bounded head/tail preview plus the artifact locator.
  max_inline_output_chars: 30000
  max_integration_repairs: 2      # fresh repair attempts after integration conflicts

# Loop detection for identical repeated tool calls (only enforced on
# providers that support a pre-tool hook).
repeat_guard:
  enabled: true
  warn_after: 3            # consecutive identical calls -> warning event
  abort_after: 5           # consecutive identical calls -> deny + LOOP_DETECTED
  exempt_tools: []         # tools whose repetition is legitimate (e.g. polling)

logging:
  level: INFO
