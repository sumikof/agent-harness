# vLLM serving for the agent harness on DGX Spark.
# All knobs live in .env (copy .env.example). The image tag MUST be a
# pinned, verified version — `latest` is rejected by start.sh.
services:
  vllm:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE in .env to a pinned, verified tag}
    container_name: harness-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      # Model cache persisted on the host: container re-creation must not
      # trigger a 30GB re-download.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      # launch.sh is generated by start.sh from .env (speculative JSON and
      # optional flags are assembled there to avoid YAML quoting hazards).
      - ./.generated:/serve:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The full argument list is assembled by start.sh into
    # .generated-command (speculative config JSON, optional flags) and
    # mounted; keeping it out of YAML avoids quoting hazards.
    entrypoint: ["/bin/bash", "/serve/launch.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
